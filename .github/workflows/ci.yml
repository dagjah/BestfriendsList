name: Checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.1 lua5.4
      - name: Parse all Lua files and run regressions
        run: |
          find . -name '*.lua' -not -path './.git/*' -print0 | xargs -0 -n1 luac5.1 -p
          lua5.1 tests/run.lua
          lua5.4 tests/run.lua
      - name: Test release tooling
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Build and verify install package
        run: python3 scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: BestfriendsList-install
          path: dist/BestfriendsList-install.zip
          if-no-files-found: error
